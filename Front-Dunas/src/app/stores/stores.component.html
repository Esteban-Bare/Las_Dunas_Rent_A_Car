<div class="container my-5">
  <div class="row">
    <div class="col-12">
      <h2 class="text-center mb-4">
        <i class="bi bi-geo-alt me-2"></i>Our Branches
      </h2>
    </div>
  </div>

  <!-- Loading State -->
  @if (isLoading) {
    <div class="text-center">
      <div class="spinner-border text-primary" role="status">
        <span class="visually-hidden">Loading...</span>
      </div>
    </div>
  }

  <!-- Error State -->
  @if (error) {
    <div class="alert alert-danger text-center">
      <i class="bi bi-exclamation-triangle me-2"></i>{{ error }}
    </div>
  }

  <!-- Stores Grid -->
  @if (!isLoading && !error) {
    <div class="row g-4">
      @for (store of stores; track store.id) {
        <div class="col-md-6 col-lg-4">
          <div class="card h-100 shadow-sm">
            <div class="card-body">
              <h5 class="card-title">
                <i class="bi bi-building me-2"></i>{{ store.name }}
              </h5>
              <p class="card-text">
                <i class="bi bi-geo-alt me-2"></i>
                <strong>{{ store.city }}</strong>
              </p>
              <p class="card-text">
                <i class="bi bi-house me-2"></i>{{ store.address }}
              </p>
              <p class="card-text">
                <i class="bi bi-telephone me-2"></i>
                <a href="tel:{{ store.phone }}" class="text-decoration-none">{{ store.phone }}</a>
              </p>
            </div>
          </div>
        </div>
      } @empty {
        <!-- Empty State -->
        <div class="text-center">
          <i class="bi bi-building display-1 text-muted"></i>
          <p class="text-muted mt-3">No branches available at the moment.</p>
        </div>
      }
    </div>
  }
</div>
